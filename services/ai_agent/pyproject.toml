[project]
name = "ai-agent"
version = "0.1.0"
description = "AI Agent microservice for dynamic game content generation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "kotti-he-oide team" }
]
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.5.0",
  "strands-agents>=0.1.0",
  "bedrock-agentcore>=0.1.0",
  "boto3>=1.34.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.26.0",
  "aws-opentelemetry-distro>=0.10.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10"
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
